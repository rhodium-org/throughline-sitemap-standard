uid: ATTR-0030
type: attribute
status: ratified
title: An element's shown if
text: 'An element''s shown if: Text; optional. The situation in which the element
  shows, in words, where shown_when''s states cannot say it: a sign-in that has run
  out, a link that invites someone, nothing held that can save. A drawing tool annotates
  the element with it; no check reads it, since it is words.'
rationale: 'Found 4 November 2026, migrating table.iddn.uk''s 221 elements to this
  standard: 31 notices show on a situation (the GitHub sign-in has run out, the review
  link invites someone, nothing held can save to this project), which shown_when''s
  four data states cannot say, so a wireframe could not show when they appear. Words,
  not an enum, because the situations are the page''s own and no checker can judge
  them; the drawing tool draws them as an annotation beside the element.'
normative: true
