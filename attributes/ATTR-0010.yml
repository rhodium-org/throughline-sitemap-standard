uid: ATTR-0010
type: attribute
status: ratified
title: An element's order
text: 'An element''s order: Position; always. Where it comes among the parts of its
  parent, components and elements alike, down a column or along a row. Positions
  are relative: a drawing reflows them at any width, and there are no coordinates
  or breakpoints.'
normative: true
